[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Zeus"
version = "1.4.3"
description = "Zeus subnet by Orpheus A.I. (Incubated by BitMind)"
authors = [
    { name = "orpheus-ai.nl", email = "eric@orpheus-ai.nl" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "bittensor==9.9.0",
    "starlette>=0.30.0",
    "pydantic>=2",
    "torch>=2.4.0",
    "dask>=2024.11.2",
    "zarr",
    "gcsfs==2024.12.0",
    "pandas>=2.2.0",
    "xarray>=2024.11.0",
    "numpy>=2.0.0",
    "h5netcdf==1.6.4",
    "ipython==8.31.0",
    "ipykernel==6.29.5",
    "wandb==0.19.0",
    "httpx==0.28.1",
    "cartopy==0.24.1",
    "tqdm==4.67.1",
    "python-dotenv==1.0.1", # Updated from dotenv to python-dotenv (correct package name)
    "check-shapes==1.1.1",
    "openmeteo-requests>=1.3.0",
]

[project.optional-dependencies]
validator = [
    "timezonefinder==6.5.8",
    "discord-webhook==1.4.1",
    "cdsapi==0.7.5",
]
miner = [
    "openmeteo-requests==1.3.0",
]
all = [
    "timezonefinder==6.5.8",
    "discord-webhook==1.4.1",
    "cdsapi==0.7.5",
    "openmeteo-requests==1.3.0",
]

[project.urls]
Homepage = "https://github.com/Orpheus-AI/Zeus"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["zeus"]

